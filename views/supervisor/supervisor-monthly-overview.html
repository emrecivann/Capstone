<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Schedule Overview - Metro Istanbul</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        .table-responsive {
            margin-top: 2rem;
            overflow-x: auto;
        }
        .worker-count {
            font-weight: bold;
            color: #1a73e8;
        }
        .date-cell {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header-title">Metro Istanbul Schedules SUPERVISOR</h1>
    </header>

    <main class="container">
        <div class="card">
            <div id="selectedInfo" style="margin-bottom: 2rem;">
                <h2>Monthly Overview</h2>
                <p>Line: <span id="selectedLine"></span></p>
                <p>Month: <span id="selectedMonth"></span></p>
            </div>

            <div class="table-responsive">
                <table class="table" id="workerTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Worker Count</th>
                        </tr>
                    </thead>
                    <tbody id="workerTableBody">
                        <!-- Table rows will be dynamically added here -->
                    </tbody>
                </table>
            </div>

            <div style="text-align: center; margin-top: 2rem;">
                <button onclick="window.location.href='supervisor-select-line.html'" class="btn btn-primary">Back to Line Selection</button>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </div>
    </main>

    <script src="../../js/supervisor/supervisor-overview.js"></script>
</body>
</html>
