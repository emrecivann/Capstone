<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Schedule - Metro Istanbul</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        .table-responsive {
            margin-top: 2rem;
            overflow-x: auto;
        }
        .schedule-nav {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .schedule-title {
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header-title">Metro Istanbul Schedules SUPERVISOR</h1>
    </header>
    <main class="container">
        <div class="card">
            <div class="schedule-title">
                <h2>Weekly Schedule</h2>
                <p>Line: <span id="selectedLine"></span></p>
                <p>Week: <span id="weekRange"></span></p>
            </div>
            <div class="schedule-nav">
                <button id="prevWeekBtn" class="btn btn-primary">Previous 7 days</button>
                <button id="nextWeekBtn" class="btn btn-primary">Next 7 days</button>
            </div>
            <div class="table-responsive">
                <table class="table" id="scheduleTable">
                    <!-- Table will be generated by JS -->
                </table>
            </div>
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div style="text-align: center; margin-top: 2rem;">
                <button onclick="window.location.href='supervisor-select-line.html'" class="btn btn-primary">Back to Line Selection</button>
            </div>
        </div>
    </main>
    <script src="../../js/supervisor/supervisor-weekly-schedule.js"></script>
</body>
</html>
